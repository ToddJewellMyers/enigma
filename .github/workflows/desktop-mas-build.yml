name: Desktop Mac App Store Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mas:
    runs-on: macos-14
    environment: mac-app-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Import Apple signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/enigma-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/enigma-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/enigma.provisionprofile"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          echo "ENIGMA_MAS_PROVISIONING_PROFILE=$PROFILE_PATH" >> "$GITHUB_ENV"
      - name: Build signed Mac App Store package
        working-directory: desktop
        run: npm run dist:mas
      - name: Upload Mac App Store package
        uses: actions/upload-artifact@v7
        with:
          name: enigma-mac-app-store
          path: desktop/dist/mas/*.pkg
          if-no-files-found: error
