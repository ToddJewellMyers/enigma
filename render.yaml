services:
  - type: web
    name: enigma-kanban
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Proxy__ForwardedHeadersEnabled
        value: "true"
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: enigma-postgres
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: PublicAppUrl
        value: https://enigma-kanban.onrender.com
      - key: Email__FromName
        value: Sweet Mahogany Boards
      - key: Email__FromAddress
        sync: false
      - key: Email__Smtp__Host
        sync: false
      - key: Email__Smtp__Port
        value: "587"
      - key: Email__Smtp__Username
        sync: false
      - key: Email__Smtp__Password
        sync: false
      - key: Email__Smtp__EnableSsl
        value: "true"

databases:
  - name: enigma-postgres
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "18"
    databaseName: enigma
    user: enigma
    ipAllowList: []
